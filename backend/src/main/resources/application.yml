spring:
  application:
    name: skillpulse
  datasource:
    # PostgreSQL default. For MySQL use e.g. jdbc:mysql://localhost:3306/skillpulse
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skillpulse}
    username: ${DB_USERNAME:skillpulse}
    password: ${DB_PASSWORD:skillpulse}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}

skillpulse:
  jwt:
    # Must be at least 32 characters. Override JWT_SECRET in every real environment.
    secret: ${JWT_SECRET:dev-only-skillpulse-secret-key-change-me-0123456789}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  mastery:
    developing-min: 50
    proficient-min: 70
    mastered-min: 85
  bootstrap-admin:
    email: ${ADMIN_EMAIL:admin@skillpulse.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}
    full-name: SkillPulse Admin
